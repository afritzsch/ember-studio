<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B1A16"/>
      <stop offset="1" stop-color="#0E0908"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="760" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5A1F" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#C2300E" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="800" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D2260C"/>
      <stop offset="0.45" stop-color="#FF6A1A"/>
      <stop offset="0.8" stop-color="#FFB530"/>
      <stop offset="1" stop-color="#FFE7A0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- level-meter bars shaped like a flame -->
    <g fill="url(#fire)">
      <rect x="243" y="590" width="58" height="210" rx="29"/>
      <rect x="323" y="470" width="58" height="330" rx="29"/>
      <rect x="403" y="330" width="58" height="470" rx="29"/>
      <rect x="483" y="230" width="58" height="570" rx="29"/>
      <rect x="563" y="360" width="58" height="440" rx="29"/>
      <rect x="643" y="500" width="58" height="300" rx="29"/>
      <rect x="723" y="620" width="58" height="180" rx="29"/>
    </g>
    <!-- sparks -->
    <circle cx="432" cy="268" r="14" fill="#FFC95A"/>
    <circle cx="597" cy="292" r="10" fill="#FFB238" opacity="0.9"/>
    <circle cx="355" cy="410" r="9" fill="#FF9A2E" opacity="0.8"/>
    <circle cx="671" cy="440" r="8" fill="#FF8A26" opacity="0.75"/>
    <!-- hot floor line -->
    <rect x="219" y="836" width="586" height="16" rx="8" fill="#FF6A1A" opacity="0.55"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
</svg>
