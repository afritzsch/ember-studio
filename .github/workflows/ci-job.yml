# One CI job: `scripts/ci.sh <job>` on the hosted xcode-27 runner (T-084; DW-261: macos-15/macos-26 top out at Xcode 26.x). Called by ci.yml, so every job
# shares the same checkout, toolchain, cache and log upload steps.
name: CI job

on:
  workflow_call:
    inputs:
      job:
        description: "scripts/ci.sh job: test, asan, tsan or perf"
        required: true
        type: string
      timeout-minutes:
        required: false
        type: number
        default: 120

permissions:
  contents: read

jobs:
  run:
    name: scripts/ci.sh ${{ inputs.job }}
    # DW-261: only the `xcode-27` image (macOS 27, Xcode 27.x; public preview) has Xcode 27; macos-26 tops
    # out at 26.6. Set the repo variable CI_RUNNER (e.g. to a self-hosted runner's label) to run elsewhere.
    runs-on: ${{ vars.CI_RUNNER || 'xcode-27' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Vendor/vst3sdk; scripts/bootstrap.sh then fetches only its hosting submodules.
          submodules: true

      - name: Select Xcode 27+ (newest stable, else newest beta/RC)
        run: |
          # DW-261: the code needs Xcode 27 / Swift 6.4 (exit tests, macOS 27 SDK); macos-15 tops out
          # at Xcode 26.3 and macos-26 (2026-11) at 26.6; the xcode-27 image has 27.0-27.2. Prefer a stable 27+, else a beta/RC 27+.
          ls -d /Applications/Xcode*.app
          all=$(ls -d /Applications/Xcode_*.app | sort -V)
          xcode=$(echo "$all" | grep -viE 'beta|_rc|release_candidate' | grep -E 'Xcode_(2[7-9]|[3-9][0-9])' | tail -n 1)
          [ -n "$xcode" ] || xcode=$(echo "$all" | grep -E 'Xcode_(2[7-9]|[3-9][0-9])' | tail -n 1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 27+ on this runner image; Ember Studio needs Xcode 27 / Swift 6.4 (DW-261)"; exit 1; fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      # Fetched dependencies only (the MCP Swift SDK). Compiled outputs are never cached: the test
      # job must build clean (DW-005), and the weekly jobs gain little from a week-old cache.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/repositories
            .build/checkouts
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: scripts/ci.sh ${{ inputs.job }}
        run: scripts/ci.sh "${{ inputs.job }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.job }}
          path: |
            .build/ci-logs/
            .build/test-logs/
          if-no-files-found: ignore
          retention-days: 14
