# One CI job: `scripts/ci.sh <job>` on a macos-26 runner (T-084; DW-261: macos-15 tops out at Xcode 26.3). Called by ci.yml, so every job
# shares the same checkout, toolchain, cache and log upload steps.
name: CI job

on:
  workflow_call:
    inputs:
      job:
        description: "scripts/ci.sh job: test, asan, tsan or perf"
        required: true
        type: string
      timeout-minutes:
        required: false
        type: number
        default: 120

permissions:
  contents: read

jobs:
  run:
    name: scripts/ci.sh ${{ inputs.job }}
    runs-on: macos-26
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Vendor/vst3sdk; scripts/bootstrap.sh then fetches only its hosting submodules.
          submodules: true

      - name: Select the newest stable Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          xcodebuild -version
          swift --version
          # DW-261: the code needs Xcode 27 / Swift 6.4 (exit tests, macOS 27 SDK). Fail clearly, not deep in the build.
          major=$(xcodebuild -version | sed -n 's/^Xcode \([0-9]*\).*/\1/p')
          if [ "${major:-0}" -lt 27 ]; then echo "::error::Newest Xcode on this runner is $major; Ember Studio needs Xcode 27+ (DW-261)"; exit 1; fi

      # Fetched dependencies only (the MCP Swift SDK). Compiled outputs are never cached: the test
      # job must build clean (DW-005), and the weekly jobs gain little from a week-old cache.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            .build/repositories
            .build/checkouts
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: scripts/ci.sh ${{ inputs.job }}
        run: scripts/ci.sh "${{ inputs.job }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.job }}
          path: |
            .build/ci-logs/
            .build/test-logs/
          if-no-files-found: ignore
          retention-days: 14
